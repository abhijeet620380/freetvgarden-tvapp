name: Build Android APK

# Runs on every push to main/master, on pull requests, on version tags (v1.0 ...) and by hand
# (GitHub -> Actions -> "Build Android APK" -> Run workflow).
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# "contents: write" lets the job publish the APK as a GitHub Release (that is what creates the download link).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ---- SIGNING KEY (needed for in-app updates) ------------------------------------------------
      # Android only lets an update replace an installed app when both are signed with the SAME key.
      # The key is stored in GitHub: Settings -> Secrets and variables -> Actions
      #   KEYSTORE_BASE64    the key file (text)
      #   KEYSTORE_PASSWORD  its password
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ftg.p12"
            echo "FTG_KEYSTORE=$RUNNER_TEMP/ftg.p12" >> "$GITHUB_ENV"
            echo "Using the permanent signing key."
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - building with a temporary key. Installed apps will NOT be able to update to this build."
          fi

      # The build number becomes the app version, so every build is newer than the one before.
      - name: Build APK
        env:
          FTG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon -PftgVersionCode=${{ github.run_number }} -PftgVersionName=1.${{ github.run_number }}

      - name: Rename APK and write version.json
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FreeTvGarden.apk
          # the installed app reads this small file to learn that a newer build exists
          printf '{"versionCode":%s,"versionName":"1.%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" > version.json
          cat version.json

      # Keeps a copy on the run page too (Actions -> the run -> Artifacts)
      - uses: actions/upload-artifact@v4
        with:
          name: FreeTvGarden-apk
          path: |
            FreeTvGarden.apk
            version.json

      # ---- PERMANENT DOWNLOAD LINK -------------------------------------------------------------
      # After every successful build on main/master, the newest APK is published to a release called "latest":
      #   https://github.com/abhijeet620380/freetvgarden-tvapp/releases/latest/download/FreeTvGarden.apk
      # The link never changes; it always gives the newest APK.
      - name: Move the "latest" tag to this commit
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish APK to the "latest" release
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FreeTV Garden TV app (latest build)
          body: |
            Newest build of the FreeTV Garden Android TV app.
            Download **FreeTvGarden.apk** below and install it on your Android TV
            (see the README for the easy way with the "Downloader" app).
          files: |
            FreeTvGarden.apk
            version.json
          make_latest: true

      # Version releases: push a tag like v1.1 and this publishes it as its own release.
      - name: Publish release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FreeTvGarden.apk
